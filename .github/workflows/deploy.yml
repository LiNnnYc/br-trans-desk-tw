name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署；新的 push 不取消進行中的部署，避免站台停在半套狀態
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 與本機 .githooks/pre-push 相同的兩項把關：混版、下載檔沒重出
      - name: 版本一致性與下載檔檢查
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python3 scripts/lint_version_consistency.py
          python3 scripts/lint_downloads.py

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 建置（astro build + Pagefind 索引）
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
